<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Persuasive Systems Quiz</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
    }
    .container {
      max-width: 700px;
      margin: 40px auto;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      padding: 24px;
    }
    h1 { margin-top: 0; }
    .question { font-weight: 700; margin: 12px 0; }
    .answers label {
      display: block;
      margin: 8px 0;
      padding: 8px;
      border-radius: 8px;
      cursor: pointer;
    }
    .answers label:hover { background: #eef2ff; }
    button {
      margin-top: 16px;
      border: 0;
      background: #4f46e5;
      color: #fff;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #result {
      margin-top: 18px;
      font-weight: 700;
      padding: 10px 12px;
      border-radius: 8px;
      background: #e0f2fe;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>Persuasive Systems Course Quiz</h1>
    <p>Test your understanding of persuasive system principles.</p>
    <div id="quiz"></div>
    <button id="submitBtn">Submit Quiz</button>
    <div id="result" hidden></div>
  </main>

  <script>
    const questions = [
      {
        text: "Which strategy gives users positive reinforcement after completing a task?",
        options: ["Reduction", "Praise", "Tunneling", "Simulation"],
        answer: 1
      },
      {
        text: "What does tailoring in persuasive systems mean?",
        options: [
          "Hiding all user data",
          "Showing generic information only",
          "Adapting content to user needs",
          "Disabling customization"
        ],
        answer: 2
      },
      {
        text: "Which principle is most related to showing progress over time?",
        options: ["Self-monitoring", "Scarcity", "Liking", "Authority"],
        answer: 0
      }
    ];

    const quizContainer = document.getElementById("quiz");
    const submitBtn = document.getElementById("submitBtn");
    const result = document.getElementById("result");

    function renderQuiz() {
      quizContainer.innerHTML = questions.map((q, i) => `
        <section>
          <div class="question">${i + 1}. ${q.text}</div>
          <div class="answers">
            ${q.options.map((opt, j) => `
              <label>
                <input type="radio" name="q${i}" value="${j}" />
                ${opt}
              </label>
            `).join("")}
          </div>
        </section>
      `).join("");
    }

    function gradeQuiz() {
      let score = 0;
      questions.forEach((q, i) => {
        const selected = document.querySelector(`input[name="q${i}"]:checked`);
        if (selected && Number(selected.value) === q.answer) {
          score += 1;
        }
      });

      result.hidden = false;
      result.textContent = `You scored ${score} out of ${questions.length}.`;
    }

    submitBtn.addEventListener("click", gradeQuiz);
    renderQuiz();
  </script>
</body>
</html>
